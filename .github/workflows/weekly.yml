name: weekly-smoke-test

on:
  workflow_dispatch:       # lets you trigger it manually to test right now
  schedule:
    - cron: "0 22 * * 3"   # 5:00 PM CDT (UTC-5) on Wednesdays — update to "0 23 * * 3" after Nov 1 DST change

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -c "import nflreadpy; print('nflreadpy import OK')"