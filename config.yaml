# Keys READ BY CODE are marked READ BY CODE below:
#   training.recency_half_life_weeks  (src/features/build_*_rolling_features.py,
#                                      src/features/build_adjusted_ratings.py,
#                                      src/features/build_split_efficiency.py)
#   live.*                            (src/predict/predict_week.py,
#                                      src/models/composite.py, src/config.py)
# Everything else documents the system's current shape. Changing it does not
# change behaviour -- update the referenced source file instead.

project:
  name: nfl-score-predictor
  target: final_score_pair   # home_score, away_score

data:
  source: nflreadpy
  season_start: 2019
  # The last season pulled is resolved at run time (src/ingest/seasons.py):
  # the new season is included from March 15, when nflverse rolls over, and a
  # season with no data published yet is skipped automatically. It no longer
  # has to be edited by hand each year.

training:
  # READ BY CODE. Tuned 2026-09-14 via src/experiments/tune_halflife.py:
  # swept [4, 8, 12, 17, 26, 39, 52] weeks on baseline/Linear/Poisson. The
  # curve is unimodal and 17 is the minimum for all three
  # (12 -> 9.4039, 17 -> 9.3921, 26 -> 9.4138 mean RMSE on Poisson).
  # Re-swept 2026-09-18 with the full feature set (test_recency_plans.py): 17
  # still wins.
  recency_half_life_weeks: 17

# When to run. NOT read by code -- the rule lives in
# src/predict/injury_readiness.py and README section 5.
#
# The injury report is the model's only leading indicator, and it is only
# FINAL (Out / Doubtful / Questionable) shortly before each game:
#   Thursday game -> Wednesday's report     Sunday game -> Friday's report
#   Saturday game -> Thursday's report      Monday game -> Saturday's report
# A forecast made earlier sees an almost empty injury report (8 of 259 rows on
# the Thursday of 2026 week 3) and silently treats every team as healthy. So a
# week is forecast in slates, each after its own final report. predict_week
# refuses to forecast a game whose final report is not in the data yet, unless
# --allow-unsettled-injuries is passed.
#
# GitHub runs the pipeline on this schedule by itself -- the cron lines in
# .github/workflows/pipeline.yml are the source of truth; these mirror them.
schedule:
  evening: "21:37 UTC daily -- soon after that day's 4pm ET final report"
  morning: "13:37 UTC daily -- refresh on overnight data (Mon: MNF refit)"
  sunday_early: "11:37 UTC -- Sunday + Monday games, before London kickoffs"
  tuesday: "13:37 UTC -- grade the week + re-run every backtest"

# READ BY CODE. The models fitted for every live forecast, and the composite
# built from them. Names must exist in src/models/registry.py and be able to
# forecast an unplayed game (predict_week checks both).
#
# Selected 2026-09-24 from the full re-benchmark of every model through
# 2026 week 2 -- see README section 9 for the numbers.
live:
  models: [poisson, gp, linear]
  composite:
    name: combined              # column prefix in data/predictions/*.parquet
    members: [poisson, gp, linear]
    method: mean                # equal weights; see src/models/composite.py

# Rule-based reference every model must beat out-of-sample to be trusted. Also
# fitted on every live forecast, for comparison.
baseline: src/models/baseline.py   # also contains the trivial league-average floor

# Built, evaluated, and shelved for showing no measurable out-of-sample gain.
# Retained in src/models/unused/ and re-benchmarked by src/models/run_all.py.
shelved_models:
  - random_forest
  - xgboost
  - lightgbm
  - catboost
  - logistic
  - mlp
  - bayesian_hierarchical
  - rnn_lstm
  - monte_carlo

meta_model:
  # src/models/stacking.py -- research only, not used live.
  type: ridge_stacker              # RidgeCV (alpha chosen in-fold by TimeSeriesSplit)
  base_models: [linear, poisson, gp]   # must match BASE_MODELS in stacking.py
  validation: walk_forward         # walk_forward_evaluate(min_train_seasons=1)
